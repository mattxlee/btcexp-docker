# Orchestrates the three Intgrow components on one Docker network:
#
#   btcexpfr (nginx, web UI)  ->  btcexp (business API)  ->  btcidx (indexer)
#                    \___________ same-origin /api proxy ____/
#
# Images are pulled from GitHub Container Registry (ghcr.io/mattxlee/*); no
# local build is performed. Only btcexpfr publishes a port (the web UI); btcexp
# and btcidx stay on the internal network. btcidx needs a bitcoind reachable
# over JSON-RPC (and optionally ZMQ).
#
# Copy .env.example to .env and adjust storage paths, the web port and the
# bitcoind connection:
#
#   cp .env.example .env
#   docker compose --env-file /etc/btcexp/<instance>.env -p btcexp-<instance> pull
#   docker compose --env-file /etc/btcexp/<instance>.env -p btcexp-<instance> up -d

# Set COMPOSE_PROJECT_NAME per deployment (for example btcexp-mainnet).
# Compose scopes container and network names by this value.
name: ${COMPOSE_PROJECT_NAME:-btcexp}

services:
  # ---------------------------------------------------------------------------
  # btcidx — Bitcoin address indexer + Electrum server (internal only).
  # ---------------------------------------------------------------------------
  btcidx:
    image: ${BTCIDX_IMAGE:-ghcr.io/mattxlee/btcidx}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Must match the file selected with --env-file so btcidx receives its
    # instance-specific RPC/ZMQ configuration too.
    env_file:
      - ${BTCIDX_ENV_FILE:-.env}
    environment:
      BTCIDX_NETWORK: ${NETWORK:-signet}
      # Container path; the host path is bind-mounted below (HOST_BTCIDX_DATA_DIR).
      BTCIDX_STORE_PATH: /var/lib/btcidx/data
      BTCIDX_HTTP_BIND: 0.0.0.0:8080
      BTCIDX_HTTP_STATIC_DIR: /var/lib/btcidx/swapper-ui/dist
      BTCIDX_ELECTRUM_ENABLED: "true"
      BTCIDX_ELECTRUM_TCP_BIND: 0.0.0.0:50001
      # Share the compose Redis for the tx/header cache.
      BTCIDX_CACHE_REDIS_URL: redis://redis:6379
      RUST_LOG: info
    extra_hosts:
      # Lets the container reach bitcoind/ZMQ running on the Docker host.
      - "host.docker.internal:host-gateway"
    # Docker's default soft limit is 1024, which a large RocksDB store can
    # exhaust. 65536 gives ample headroom for the indexer; nothing raises the
    # limit at runtime, so soft and hard are the same.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${HOST_BTCIDX_DATA_DIR:-./data/btcidx}:/var/lib/btcidx/data
    depends_on:
      - redis
    networks:
      - btcexp-net

  # ---------------------------------------------------------------------------
  # btcexp — business API layer (REST + WebSocket) on top of btcidx (internal).
  # ---------------------------------------------------------------------------
  btcexp:
    image: ${BTCEXP_IMAGE:-ghcr.io/mattxlee/btcexp}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NETWORK: ${NETWORK:-signet}
      INDEXER_BACKEND: btcidx
      # In-network service names (not localhost).
      BTCIDX_REST_URL: http://btcidx:8080
      BTCIDX_ELECTRUM_ADDR_PORT: btcidx:50001
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      - btcidx
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - btcexp-net

  # ---------------------------------------------------------------------------
  # btcexpfr — frontend (nginx). Serves the SPA and proxies /api to btcexp.
  # This is the only service reachable from outside Docker.
  # The public origin used for SEO canonical/sitemap is baked into the image.
  # ---------------------------------------------------------------------------
  btcexpfr:
    image: ${BTCEXPFR_IMAGE:-ghcr.io/mattxlee/btcexpfr}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_PROXY: http://btcexp:3000
      PRICE_PROXY: https://price.intgrow.com
    volumes:
      # Overridden template: same as btcexpfr/nginx.conf but with Docker's
      # embedded DNS resolver so the `btcexp` service name resolves.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    # Keep the gateway local by default; publish it through a TLS reverse proxy
    # when it must be reachable beyond this host.
    ports:
      - "127.0.0.1:${PUB_WEB_PORT:-8088}:80"
    depends_on:
      - btcexp
    networks:
      - btcexp-net

  # ---------------------------------------------------------------------------
  # Redis — shared cache for btcexp and btcidx (internal only).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${HOST_REDIS_DATA_DIR:-./data/redis}:/data
    networks:
      - btcexp-net

networks:
  btcexp-net:
    driver: bridge
