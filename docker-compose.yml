# Orchestrates the Intgrow components on one Docker network:
#
#   btcexp (SSR web UI + realtime /ws)  ->  btcidx (indexer)
#                   \_______________________ redis (shared cache)
#
# Images are pulled from GitHub Container Registry (ghcr.io/mattxlee/*); no
# local build is performed. Only btcexp publishes a port; btcidx and redis
# stay on the internal network. btcidx needs a bitcoind reachable over
# JSON-RPC (and optionally ZMQ).
#
# btcexpfr has been folded into btcexp and is no longer part of this stack.
#
# Copy .env.example to .env and adjust storage paths, the web port, site
# origin and the bitcoind connection:
#
#   cp .env.example .env
#   docker compose --env-file /etc/btcexp/<instance>.env -p btcexp-<instance> pull
#   docker compose --env-file /etc/btcexp/<instance>.env -p btcexp-<instance> up -d

# Set COMPOSE_PROJECT_NAME per deployment (for example btcexp-mainnet).
# Compose scopes container and network names by this value.
name: ${COMPOSE_PROJECT_NAME:-btcexp}

services:
  # ---------------------------------------------------------------------------
  # btcidx — Bitcoin address indexer + Electrum server (internal only).
  # ---------------------------------------------------------------------------
  btcidx:
    image: ${BTCIDX_IMAGE:-ghcr.io/mattxlee/btcidx}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Must match the file selected with --env-file so btcidx receives its
    # instance-specific RPC/ZMQ configuration too.
    env_file:
      - ${BTCIDX_ENV_FILE:-.env}
    environment:
      BTCIDX_NETWORK: ${NETWORK:-signet}
      # Container path; the host path is bind-mounted below (HOST_BTCIDX_DATA_DIR).
      BTCIDX_STORE_PATH: /var/lib/btcidx/data
      BTCIDX_HTTP_BIND: 0.0.0.0:8080
      BTCIDX_HTTP_STATIC_DIR: /var/lib/btcidx/swapper-ui/dist
      BTCIDX_ELECTRUM_ENABLED: "true"
      BTCIDX_ELECTRUM_TCP_BIND: 0.0.0.0:50001
      # Share the compose Redis for the tx/header cache.
      BTCIDX_CACHE_REDIS_URL: redis://redis:6379
      RUST_LOG: info
    extra_hosts:
      # Lets the container reach bitcoind/ZMQ running on the Docker host.
      - "host.docker.internal:host-gateway"
    # Docker's default soft limit is 1024, which a large RocksDB store can
    # exhaust. 65536 gives ample headroom for the indexer; nothing raises the
    # limit at runtime, so soft and hard are the same.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${HOST_BTCIDX_DATA_DIR:-./data/btcidx}:/var/lib/btcidx/data
    depends_on:
      - redis
    networks:
      - btcexp-net

  # ---------------------------------------------------------------------------
  # btcexp — server-rendered web UI + first-party realtime socket, on top of
  # btcidx. This is the only service reachable from outside Docker. The JSON
  # API and Swagger stay off unless API_ENABLED=true.
  # ---------------------------------------------------------------------------
  btcexp:
    image: ${BTCEXP_IMAGE:-ghcr.io/mattxlee/btcexp}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NETWORK: ${NETWORK:-signet}
      INDEXER_BACKEND: btcidx
      # In-network service names (not localhost).
      BTCIDX_REST_URL: http://btcidx:8080
      BTCIDX_ELECTRUM_ADDR_PORT: btcidx:50001
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
      # JSON/WS API and Swagger are off by default; the SSR UI talks to the
      # service layer directly. Enable only if a client needs the API.
      API_ENABLED: ${API_ENABLED:-false}
      API_KEY: ${API_KEY:-}
      # Public origin used for canonical/Open Graph URLs and /sitemap.xml.
      # Empty keeps relative canonicals and disables the sitemap.
      APP_URL: ${APP_URL:-}
      # GA4 measurement ID; empty disables analytics.
      GA_ID: ${GA_ID:-}
      # External BTC price quote endpoint; empty disables the price card.
      PRICE_API_URL: ${PRICE_API_URL:-https://price.intgrow.com}
      PRICE_INST_ID: ${PRICE_INST_ID:-BTC-USDT}
      # Network-switch links in the header; empty hides the link.
      MAINNET_URL: ${MAINNET_URL:-}
      TESTNET4_URL: ${TESTNET4_URL:-}
      # Concurrent first-party /ws connections per client IP.
      WS_MAX_CONNS_PER_IP: ${WS_MAX_CONNS_PER_IP:-5}
    # Keep the HTTP port (UI + ops + /ws) on the host loopback by default;
    # publish it through a TLS reverse proxy for access from elsewhere.
    ports:
      - "127.0.0.1:${PUB_WEB_PORT:-8088}:3000"
    depends_on:
      - btcidx
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - btcexp-net

  # ---------------------------------------------------------------------------
  # Redis — shared cache for btcexp and btcidx (internal only).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${HOST_REDIS_DATA_DIR:-./data/redis}:/data
    networks:
      - btcexp-net

networks:
  btcexp-net:
    driver: bridge
