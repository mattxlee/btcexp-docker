# Override of btcexpfr/nginx.conf for the compose stack.
#
# The only change from the upstream file is the `resolver` directive: when
# proxy_pass uses a variable (${API_PROXY} / ${PRICE_PROXY}) nginx resolves the
# hostname at request time. Inside Docker the service name `btcexp` is served by
# Docker's embedded DNS at 127.0.0.11, so it must be listed first (127.0.0.11
# forwards external lookups such as price.intgrow.com upstream).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/ld+json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback. index.html is revalidated so a redeploy immediately
    # updates titles/meta; hashed /assets/* stay immutable (see below).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, no-cache, must-revalidate" always;
    }

    # Real 404 for missing files (e.g. stale /assets refs) instead of 200 index.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Short, positive cache for SEO/static metadata files.
    location ~ ^/(robots\.txt|sitemap\.xml|logo\.svg|favicon\.ico|favicon(-[0-9]+x[0-9]+)?\.png|icon-[0-9]+\.png|apple-touch-icon\.png|manifest\.webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy (same-origin). 127.0.0.11 = Docker embedded DNS.
    # Runtime DNS for variable-based proxy_pass, IPv4 only (no IPv6 route in container)
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 ipv6=off valid=30s;

    location /api/ {
        proxy_pass ${API_PROXY};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Forward the BACKEND hostname so upstream routing/authentication works.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;

        # Required when proxying to an HTTPS upstream behind Cloudflare/CDN
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass ${API_PROXY};
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /api-docs {
        proxy_pass ${API_PROXY};
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # BTC market price upstream (no CORS from the browser). The trailing "/"
    # on proxy_pass rewrites away the /price/ location prefix.
    location /price/ {
        proxy_pass ${PRICE_PROXY}/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
